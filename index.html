<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">

    <!-- AVATAR: replace src with your photo URL -->
    <div class="avatar-wrapper">
      <img class="avatar" src="https://placehold.co/120x120/222/888?text=YOU" alt="Your photo" />
    </div>

    <!-- NAME: replace with your name -->
    <h1 class="name">Your Name</h1>

    <!-- TAGLINE: replace with your tagline -->
    <p class="tagline">Your tagline goes here</p>

    <!-- BUTTONS: update href and label for each button -->
    <nav class="links">
      <a class="btn" href="#">Button One</a>
      <a class="btn" href="#">Button Two</a>
      <a class="btn" href="#">Button Three</a>
      <a class="btn" href="#">Button Four</a>
      <a class="btn" href="#">Button Five</a>
    </nav>

    <!-- FOOTER: update with your info -->
    <footer class="footer">© 2026 Your Name</footer>

  </div>
</body>
</html>
